% ya.cfg -- tex4ht configuration for the HTML version of yalatex notes.
%
% Used by build.mjs (make4ht -c ya.cfg). Everything here only marks things up
% so that build.mjs can find them; the page structure and styling are made
% there and in web/notes.css.
\Preamble{xhtml,mathjax}
\makeatletter

% ---------------------------------------------------------------- headings
% titlesec's \titlelabel{\thetitle.} names the section number \thetitle,
% which titlesec sets at each heading -- but tex4ht replaces the code that does
% so, and \thetitle stays titling's document title ("MATH606: ... ." instead of
% "1.1."). Set it again whenever a heading starts.
\AddToHook{cmd/section/before}{\gdef\thetitle{\thesection}}
\AddToHook{cmd/subsection/before}{\gdef\thetitle{\thesubsection}}
\AddToHook{cmd/subsubsection/before}{\gdef\thetitle{\thesubsubsection}}

% ---------------------------------------------------------------- environments
% Wrap every notes environment in <div class="ya-env" data-env="name">, so the
% build knows which kind each block is (tex4ht marks tcolorbox boxes with
% their name but thmtools environments only as "newtheorem").
\def\ya@env#1{%
  \AddToHook{env/#1/before}{\ifvmode\IgnorePar\fi\EndP\HCode{<div class="ya-env" data-env="#1">}}%
  \AddToHook{env/#1/after}{\ifvmode\IgnorePar\fi\EndP\HCode{</div>}}}
\@for\ya@e:=thm,defn,lem,cor,prop,conj,notebox,ex,que,rmk,claim,exercise,notethm\do{%
  \expandafter\ya@env\expandafter{\ya@e}%
  \expandafter\ya@env\expandafter{\ya@e*}}
\ya@env{proof}

% A \label in a box's body (ya-notes-thms: "ya label in body") restores the
% label state saved when the box was numbered, in its title. tex4ht keeps its
% own part of that state in \:currentlabel (the anchor is \cur:th\:currentlabel)
% and puts the anchor in the title, which it doesn't output. Save and restore
% \:currentlabel too, and put the anchor at the start of the body.
\apptocmd\ya@savelabel
  {\global\expandafter\let\expandafter\ya@saved@tfhlabel\csname :currentlabel\endcsname}{}
  {\PackageError{ya.cfg}{can't patch \string\ya@savelabel}{}}
\apptocmd\ya@restorelabel
  {\expandafter\let\csname :currentlabel\endcsname\ya@saved@tfhlabel
   \HCode{<a id="\csname cur:th\endcsname\csname :currentlabel\endcsname"></a>}}{}
  {\PackageError{ya.cfg}{can't patch \string\ya@restorelabel}{}}

% ---------------------------------------------------------------- references
% Mark which label an \eqref names: tex4ht numbers equations badly (none for
% a labeled line of align*, which then shows "??"), so build.mjs fills in
% equation references itself; this is how it finds them. (Only \eqref: the
% notes refer to equations with nothing else.)
\NewCommandCopy\ya@eqref\eqref
\DeclareDocumentCommand\eqref{m}{\HCode{<span class="ya-ref" data-label="\detokenize{#1}">}\ya@eqref{#1}\HCode{</span>}}

% ---------------------------------------------------------------- terms
% \term[forms]{body}: a defined term. The body is marked up as a span; the
% forms (the bracket argument, raw TeX) go to <job>.terms, one line per term,
% "number forms", matched by data-term. \termnt[...] is bold only.
\newcount\ya@termno
\newwrite\ya@termfile
\immediate\openout\ya@termfile=\jobname.terms
\RenewDocumentCommand\term{O{} m}{%
  \leavevmode\global\advance\ya@termno 1
  \immediate\write\ya@termfile{\the\ya@termno\space\detokenize{#1}}%
  \HCode{<span class="ya-term" data-term="\the\ya@termno">}#2\HCode{</span>}}
\RenewDocumentCommand\termnt{m}{%
  \leavevmode\HCode{<span class="ya-termnt">}#1\HCode{</span>}}

% ---------------------------------------------------------------- diagrams
% quiver puts its diagrams in \[ ... \]. With the mathjax option tex4ht hands
% every display to MathJax as text, which can't draw tikz-cd. A display that
% holds a tikzcd is typeset instead, so tex4ht draws it as an SVG picture
% like any other TikZ picture (build.mjs takes it out of the math span).
% tex4ht's \[ reads the display with MathJax catcodes; for a diagram, put the
% normal ones back and read it again (\scantokens). \] then closes the span.
\ifdefined\AltlDisplay\else\PackageError{ya.cfg}{tex4ht's \string\AltlDisplay\space not found}{}\fi
\let\ya@AltlDisplay\AltlDisplay
\ExplSyntaxOn
\long\def\AltlDisplay#1\]{%
  \str_if_in:nnTF{#1}{tikzcd}% (as strings: the catcodes here are MathJax's)
    {\ya@diagram{#1}}{\ya@AltlDisplay#1\]}}
\ExplSyntaxOff
\long\def\ya@diagram#1{%
  \csname :RestoreMathjaxCatcodes\endcsname\catcode`\&=4\relax
  \scantokens{#1}\]}

% Young tableaux (ytableau) start math mode with $ internally, and tex4ht's
% mathjax option reads every $ ... $ as text for MathJax; MathJax has no
% ytableau either. So a tableau is always drawn by TeX as a picture: in text
% (the environment and \ydiagram), and in a formula, where the whole formula
% becomes one picture (\alteqtoks is where tex4ht hands a formula's TeX to
% MathJax; for align*-like environments it gets only the body, typeset here
% as aligned).
\newif\ifya@inpic
% (\ya@ownpic: this tableau opened the picture, so its end closes it)
\def\ya@own{own}\let\ya@ownpic\relax
\AddToHook{env/ytableau/before}{\ifya@inpic\else\leavevmode\Picture*{ class="ya-pic"}\hbox\bgroup
  \ya@inpictrue\let\ya@ownpic\ya@own\RestoreMathJaxEnvironments\fi}
\AddToHook{env/ytableau/after}{\ifx\ya@ownpic\ya@own\egroup\EndPicture\fi}
\NewCommandCopy\ya@ydiagram\ydiagram
\DeclareDocumentCommand\ydiagram{o m}{%
  \ifya@inpic\IfNoValueTF{#1}{\ya@ydiagram{#2}}{\ya@ydiagram[#1]{#2}}%
  \else\leavevmode\Picture*{ class="ya-pic"}\hbox{\ya@inpictrue\RestoreMathJaxEnvironments
    \IfNoValueTF{#1}{\ya@ydiagram{#2}}{\ya@ydiagram[#1]{#2}}}\EndPicture\fi}
\ExplSyntaxOn
\cs_set_eq:NN \ya_alteqtoks:n \alteqtoks
\cs_set_protected:Npn \alteqtoks #1
  {
    \str_if_in:nnTF {#1} {ytableau} { \ya_math_picture:n {#1} }
      { \str_if_in:nnTF {#1} {ydiagram} { \ya_math_picture:n {#1} } { \ya_alteqtoks:n {#1} } }
  }
\tl_new:N \l__ya_pic_tl
\cs_new_protected:Npn \ya_math_picture:n #1
  {
    \tl_set:Ne \l__ya_pic_tl { \detokenize {#1} }
    \bool_set_false:N \l_tmpa_bool   % inline?
    \regex_match:nVT { \A\s*\\\( } \l__ya_pic_tl { \bool_set_true:N \l_tmpa_bool }
    \regex_replace_once:nnN { \A\s*\\[\[\(] (.*) \\[\]\)]\s*\Z } { \1 } \l__ya_pic_tl
    \bool_if:NTF \l_tmpa_bool
      { \tl_put_left:Ne \l__ya_pic_tl { \c_backslash_str hbox \c_left_brace_str $ }
        \tl_put_right:Ne \l__ya_pic_tl { $ \c_right_brace_str } }
      { \tl_put_left:Ne \l__ya_pic_tl { \c_backslash_str hbox \c_left_brace_str $ \c_backslash_str displaystyle \c_backslash_str begin \c_left_brace_str aligned \c_right_brace_str }
        \tl_put_right:Ne \l__ya_pic_tl { \c_backslash_str end \c_left_brace_str aligned \c_right_brace_str $ \c_right_brace_str } }
    \group_begin:
      \use:c { :RestoreMathjaxCatcodes } \char_set_catcode_alignment:N \&
      \ya@inpictrue
      \RestoreMathJaxEnvironments   % (else aligned, matrix, ... are read as text for MathJax)
      \Picture*{~class="ya-pic"}
      \exp_args:NV \tex_scantokens:D \l__ya_pic_tl
      \EndPicture
    \group_end:
  }
\cs_generate_variant:Nn \regex_match:nnT { nV }
\ExplSyntaxOff

% ---------------------------------------------------------------- figures
% Inkscape figures (no longer used for new notes): tex4ht can't size the PDF
% inside a .pdf_tex, so only a placeholder pointing to the PDF.
\RenewDocumentCommand\incfig{O{} m}{%
  \ifvmode\IgnorePar\fi\EndP
  \HCode{<figure class="ya-missing">Figure "#2": see the PDF.</figure>}}

% ---------------------------------------------------------------- proof titles
% tex4ht expands a proof's title (\begin{proof}[Proof that $A\cong B$]), which
% mangles the formulas in it. A \protected macro holding the title keeps it as
% written. (thmtools's \proof does the expanding; set up in each proof, since
% tex4ht redefines \proof at the start of the document.)
\def\ya@proofwrap{\@ifnextchar[\ya@proofopt\ya@proofx}
\def\ya@proofopt[#1]{\protected\def\ya@ptitle{#1}\ya@proofx[\ya@ptitle]}
\def\ya@fixproof{\ifx\proof\ya@proofwrap\else
  \let\ya@proofx\proof \let\proof\ya@proofwrap\fi}
\AddToHook{env/proof/begin}{\ya@fixproof}

\makeatother
\begin{document}
\EndPreamble
